# Compiles, lints and tests the extension on every push to main or dev (merges
# included), and on pull requests into them.
name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs compile and lint first (pretest). The VS Code tests need a display.
      - name: Test
        run: xvfb-run -a npm test
